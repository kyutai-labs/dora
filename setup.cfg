[pep8]
max-line-length = 100

[flake8]
max-line-length = 100
# E203 (whitespace before ':') is how ruff and black format slices, e.g.
# `xs[a : b]`, and PEP 8 agrees with them. flake8 does not, so it has to be
# told, or every formatted slice becomes a lint error.
extend-ignore = E203

[yapf]
column_limit = 100

[mypy]

[mypy-treetable.*,IPython.*]
ignore_missing_imports = True

